name: CRM production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run syntax checks
        run: pnpm check

      - name: Check VPS deployment scripts
        run: shellcheck scripts/deploy-vps-release.sh scripts/backup-vps-postgres.sh

      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy exact commit to VPS
    needs: verify
    runs-on: ubuntu-latest
    # Deployment is deliberately disabled to prevent automatic migrations.
    # Re-enabling requires a reviewed, migration-free deployment process.
    if: ${{ false }} # VPS deployment disabled until migration-free release is approved
    environment: production
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'Missing VPS_KNOWN_HOSTS'; exit 1; }

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Copy the reviewed source archive to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="/opt/aureum-sales-crm/releases/${GITHUB_SHA}"
          git archive --format=tar.gz "$GITHUB_SHA" \
            | ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                "set -eu; mkdir -p '$release_dir'; tar -xzf - -C '$release_dir'"

      - name: Build and switch the VPS container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="/opt/aureum-sales-crm/releases/${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "AUREUM_SCHEMA_BASELINE_THROUGH=013 bash '$release_dir/scripts/deploy-vps-release.sh' '$release_dir' '${GITHUB_SHA}'"

